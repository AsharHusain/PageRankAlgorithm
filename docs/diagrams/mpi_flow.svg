<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 1122 794" role="img" aria-labelledby="title desc">
  <title id="title">MPI PageRank flow</title>
  <desc id="desc">Setup, synchronized timer, iteration collectives, convergence decision, and maximum elapsed time reduction.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#111"/></marker></defs>
  <rect width="1122" height="794" fill="#fff"/>
  <text x="561" y="65" text-anchor="middle" font-family="Georgia, serif" font-size="35" font-weight="bold" fill="#111">MPI PageRank · execution flow</text>
  <g fill="#fff" stroke="#111" stroke-width="2.5">
    <rect x="370" y="103" width="382" height="58"/><rect x="370" y="180" width="382" height="58"/><rect x="370" y="257" width="382" height="58"/>
    <rect x="370" y="342" width="382" height="68"/><rect x="370" y="432" width="382" height="74"/><rect x="370" y="528" width="382" height="67"/><rect x="370" y="616" width="382" height="67"/>
    <path d="M561 694L654 737L561 780L468 737Z"/>
    <rect x="817" y="698" width="250" height="78"/><rect x="36" y="698" width="280" height="78"/>
  </g>
  <g font-family="Georgia, serif" fill="#111" text-anchor="middle">
    <text x="561" y="141" font-size="21">MPI_Init · obtain rank and process count</text>
    <text x="561" y="218" font-size="21">Build same graph / CSR · assign owned range</text>
    <text x="561" y="295" font-size="21">Initialize ranks · prepare Allgatherv layout</text>
    <text x="561" y="371" font-size="21"><tspan x="561">MPI_Barrier</tspan><tspan x="561" dy="27">Start timer</tspan></text>
    <text x="561" y="460" font-size="20"><tspan x="561">MPI_Allreduce SUM: dangling rank</tspan><tspan x="561" dy="27">Update owned ranks using global dangling sum</tspan></text>
    <text x="561" y="555" font-size="21"><tspan x="561">MPI_Allgatherv: assemble full next vector</tspan><tspan x="561" dy="27">Compute local L1 error</tspan></text>
    <text x="561" y="643" font-size="21"><tspan x="561">MPI_Allreduce SUM: global error</tspan><tspan x="561" dy="27">Swap rank vectors</tspan></text>
    <text x="561" y="744" font-size="19">error &lt; tolerance?</text>
    <text x="942" y="729" font-size="20"><tspan x="942">Yes · finish loop</tspan><tspan x="942" dy="26">MPI_Reduce MAX elapsed</tspan></text>
    <text x="176" y="729" font-size="20"><tspan x="176">No · next iteration</tspan><tspan x="176" dy="26">until max iterations</tspan></text>
  </g>
  <g fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M561 161V174"/><path d="M561 238V251"/><path d="M561 315V336"/><path d="M561 410V426"/><path d="M561 506V522"/><path d="M561 595V610"/><path d="M561 683V688"/>
    <path d="M654 737H809"/><path d="M468 737H324"/><path d="M176 698V561H353V466H362"/>
  </g>
  <g font-family="Georgia, serif" font-size="18" fill="#111"><text x="723" y="722">Yes</text><text x="382" y="722">No</text></g>
</svg>
